<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://pwodiopbnnngkfwqpjrg.supabase.co; form-action 'none'; base-uri 'none'">
  <title>Reset your password</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101827; color: #f7fafc; }
    main { box-sizing: border-box; width: min(92vw, 390px); padding: 28px; border: 1px solid #334155; border-radius: 16px; background: #192536; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { color: #cbd5e1; line-height: 1.5; }
    label { display: block; margin: 18px 0 6px; }
    input { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #64748b; border-radius: 8px; background: #0f172a; color: white; font: inherit; }
    button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 8px; background: #22a6b3; color: #06202a; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #message { min-height: 1.5em; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <h1 id="page-title">Account confirmation</h1>
    <p id="intro">Choose a new password for your Binary Brains account.</p>
    <form id="reset-form" hidden>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
      <button id="submit-button" type="submit">Save new password</button>
    </form>
    <p id="message" role="status" aria-live="polite">Checking your reset link…</p>
  </main>

  <script>
    // This is the Supabase project's publishable/anon key, never a service-role key.
    const SUPABASE_URL = "https://pwodiopbnnngkfwqpjrg.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3b2Rpb3Bibm5uZ2tmd3FwanJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNzc0MTQsImV4cCI6MjEwNTc1MzQxNH0.jIDwM76MXF36zZG8S2T79Pu4B9fCG_LeaXfsA9W7pXQ";

    const form = document.getElementById("reset-form");
    const message = document.getElementById("message");
    const intro = document.getElementById("intro");
    const pageTitle = document.getElementById("page-title");
    const submitButton = document.getElementById("submit-button");
    const params = new URLSearchParams(window.location.hash.slice(1));
    let accessToken = params.get("access_token");
    const recoveryType = params.get("type");
    const linkError = params.get("error_description") || params.get("error");

    // Remove the one-time recovery token from the visible URL and browser history.
    if (window.location.hash) {
      history.replaceState(null, "", window.location.pathname + window.location.search);
    }

    if (linkError) {
      message.textContent = "This reset link is invalid or expired. Request another one in the game.";
    } else if (recoveryType === "email_change") {
      pageTitle.textContent = "Email confirmation";
      intro.textContent = "Supabase accepted this email-change confirmation link.";
      message.textContent = "If Supabase sent a confirmation link to both email addresses, open the link in the other inbox too. Once all required confirmations are complete, return to the game and sign in with the updated email.";
    } else if (!accessToken || recoveryType !== "recovery") {
      pageTitle.textContent = "Password reset";
      message.textContent = "This reset link is invalid or expired. Request another one in the game.";
    } else {
      pageTitle.textContent = "Reset your password";
      form.hidden = false;
      message.textContent = "Enter a password with at least 8 characters.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (password.length < 8) {
        message.textContent = "Password must be at least 8 characters.";
        return;
      }
      if (password !== confirmPassword) {
        message.textContent = "The passwords do not match.";
        return;
      }

      submitButton.disabled = true;
      message.textContent = "Updating your password…";
      try {
        const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${accessToken}`
          },
          body: JSON.stringify({ password })
        });
        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
          message.textContent = result.msg || result.message || "Could not update the password. Request a new reset link and try again.";
          submitButton.disabled = false;
          return;
        }

        accessToken = "";
        form.hidden = true;
        intro.textContent = "Your password has been changed. Return to the game and log in with your new password.";
        message.textContent = "Password updated successfully.";
      } catch (_) {
        message.textContent = "Could not connect. Check your connection and try again.";
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
